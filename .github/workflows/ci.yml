name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest-l
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Packages Auth
        run: |
          for f in .npmrc examples/.npmrc examples/api/.npmrc tests/.npmrc; do
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> "$f"
          done

      - name: Setup
        run: make setup

      - name: CI
        run: make ci ${{ runner.debug == '1' && 'debug=1' || '' }}

      - name: Generate SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
