name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "examples/package.json"
      - "examples/package-lock.json"
      - "examples/api/package.json"
      - "examples/api/package-lock.json"
      - "tests/package.json"
      - "tests/package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "examples/package.json"
      - "examples/package-lock.json"
      - "examples/api/package.json"
      - "examples/api/package-lock.json"
      - "tests/package.json"
      - "tests/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@wahidgroup"

      - name: Setup
        run: make setup NPM_INSTALL_FLAGS=--ignore-scripts

      - name: Security Audit
        run: make audit
